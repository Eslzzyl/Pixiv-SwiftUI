name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Read Xcode version
        id: xcode
        shell: bash
        run: |
          xcode_version=$(xcodebuild -version)
          xcode_version=${xcode_version%%$'\n'*}
          xcode_version=${xcode_version// /-}
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "Using $xcode_version"

      - name: Cache Swift packages
        id: swift-packages-cache
        uses: actions/cache@v5
        with:
          path: |
            build/derived_data/SourcePackages
            build/derived_data_macos_arm64/SourcePackages
            build/derived_data_macos_x86_64/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-spm-${{ hashFiles('Pixiv-SwiftUI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-spm-
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Checkout tags translation data
        uses: actions/checkout@v7
        with:
          repository: Eslzzyl/pixiv-tags-data
          token: ${{ secrets.PIXIV_TAGS_READ_TOKEN }}
          path: .tag-data
          sparse-checkout: tags.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare tag translations
        id: tag-data
        shell: bash
        run: |
          set -euo pipefail

          test -s .tag-data/tags.json
          jq -e '
            type == "object" and
            (.timestamp | type == "string") and
            (.tags | type == "object" and length > 0)
          ' .tag-data/tags.json >/dev/null

          tags_count=$(jq -r '.tags | length' .tag-data/tags.json)
          echo "Tag count: $tags_count"
          echo "count=$tags_count" >> "$GITHUB_OUTPUT"

          mkdir -p Resources
          jq -cS . .tag-data/tags.json > Resources/tags.json
          test -s Resources/tags.json

          tags_commit=$(git -C .tag-data rev-parse HEAD)
          echo "commit=$tags_commit" >> "$GITHUB_OUTPUT"
          echo "Using pixiv-tags-data commit: $tags_commit"
          {
            echo "## Tag data"
            echo "- Repository: Eslzzyl/pixiv-tags-data"
            echo "- Commit: $tags_commit"
            echo "- Tags: $tags_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release artifacts
        env:
          SKIP_PACKAGE_PLUGIN_VALIDATION: true
        run: ./scripts/build.sh

      - name: Upload artifacts for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pixiv-SwiftUI.ipa
          path: build/Pixiv-SwiftUI.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload arm64 DMG artifact for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pixiv-SwiftUI-arm64.dmg
          path: build/Pixiv-SwiftUI-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload x86_64 DMG artifact for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pixiv-SwiftUI-x86_64.dmg
          path: build/Pixiv-SwiftUI-x86_64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS_DATA_COMMIT: ${{ steps.tag-data.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$GITHUB_REF_NAME"
          assets=(
            build/Pixiv-SwiftUI.ipa
            build/Pixiv-SwiftUI-arm64.dmg
            build/Pixiv-SwiftUI-x86_64.dmg
          )

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            gh release create "$release_tag" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$release_tag" \
              --notes "pixiv-tags-data commit: $TAGS_DATA_COMMIT"
          fi
