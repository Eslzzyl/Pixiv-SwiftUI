name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: xcode-27
    timeout-minutes: 15
    outputs:
      tags_commit: ${{ steps.tag-data.outputs.commit }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Checkout tags translation data
        uses: actions/checkout@v7
        with:
          repository: Eslzzyl/pixiv-tags-data
          token: ${{ secrets.PIXIV_TAGS_READ_TOKEN }}
          path: .tag-data
          sparse-checkout: tags.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare tag translations
        id: tag-data
        shell: bash
        run: |
          set -euo pipefail

          test -s .tag-data/tags.json
          jq -e '
            type == "object" and
            (.timestamp | type == "string") and
            (.tags | type == "object" and length > 0)
          ' .tag-data/tags.json >/dev/null

          tags_count=$(jq -r '.tags | length' .tag-data/tags.json)
          echo "Tag count: $tags_count"
          echo "count=$tags_count" >> "$GITHUB_OUTPUT"

          mkdir -p Resources
          jq -cS . .tag-data/tags.json > Resources/tags.json
          test -s Resources/tags.json

          tags_commit=$(git -C .tag-data rev-parse HEAD)
          echo "commit=$tags_commit" >> "$GITHUB_OUTPUT"
          echo "Using pixiv-tags-data commit: $tags_commit"
          {
            echo "## Tag data"
            echo "- Repository: Eslzzyl/pixiv-tags-data"
            echo "- Commit: $tags_commit"
            echo "- Tags: $tags_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tag data
        uses: actions/upload-artifact@v7
        with:
          name: tag-data
          path: Resources/tags.json
          if-no-files-found: error
          retention-days: 1

  build-ios:
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Download tag data
        uses: actions/download-artifact@v7
        with:
          name: tag-data
          path: Resources

      - name: Read Xcode version
        id: xcode
        shell: bash
        run: |
          xcode_version=$(xcodebuild -version | tr '\n' '-' | tr ' ' '-' | sed 's/-$//')
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "Using $xcode_version"

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            build/derived_data/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-ios-spm-${{ hashFiles('Pixiv-SwiftUI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-ios-spm-
            ${{ runner.os }}-${{ runner.arch }}-ios-spm-

      - name: Cache Xcode build data
        uses: actions/cache@v5
        with:
          path: build/derived_data/Build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-ios-xcode-build-${{ hashFiles('Pixiv-SwiftUI.xcodeproj/project.pbxproj', 'Pixiv-SwiftUI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ needs.prepare.outputs.tags_commit }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-ios-xcode-build-
            ${{ runner.os }}-${{ runner.arch }}-ios-xcode-build-

      - name: Build iOS IPA
        env:
          SKIP_PACKAGE_PLUGIN_VALIDATION: true
        run: ./scripts/build_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pixiv-SwiftUI.ipa
          path: build/Pixiv-SwiftUI.ipa
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7

      - name: Download tag data
        uses: actions/download-artifact@v7
        with:
          name: tag-data
          path: Resources

      - name: Read Xcode version
        id: xcode
        shell: bash
        run: |
          xcode_version=$(xcodebuild -version | tr '\n' '-' | tr ' ' '-' | sed 's/-$//')
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "Using $xcode_version"

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            build/derived_data_macos_${{ matrix.arch }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-macos-${{ matrix.arch }}-spm-${{ hashFiles('Pixiv-SwiftUI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-macos-${{ matrix.arch }}-spm-
            ${{ runner.os }}-${{ runner.arch }}-macos-${{ matrix.arch }}-spm-

      - name: Cache Xcode build data
        uses: actions/cache@v5
        with:
          path: build/derived_data_macos_${{ matrix.arch }}/Build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-macos-${{ matrix.arch }}-xcode-build-${{ hashFiles('Pixiv-SwiftUI.xcodeproj/project.pbxproj', 'Pixiv-SwiftUI.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ needs.prepare.outputs.tags_commit }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-macos-${{ matrix.arch }}-xcode-build-
            ${{ runner.os }}-${{ runner.arch }}-macos-${{ matrix.arch }}-xcode-build-

      - name: Build macOS DMG
        env:
          SKIP_PACKAGE_PLUGIN_VALIDATION: true
        run: ./scripts/build_dmg.sh --arch "${{ matrix.arch }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pixiv-SwiftUI-${{ matrix.arch }}.dmg
          path: build/Pixiv-SwiftUI-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - prepare
      - build-ios
      - build-macos
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v7
        with:
          name: Pixiv-SwiftUI.ipa
          path: build

      - name: Download arm64 DMG
        uses: actions/download-artifact@v7
        with:
          name: Pixiv-SwiftUI-arm64.dmg
          path: build

      - name: Download x86_64 DMG
        uses: actions/download-artifact@v7
        with:
          name: Pixiv-SwiftUI-x86_64.dmg
          path: build

      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS_DATA_COMMIT: ${{ needs.prepare.outputs.tags_commit }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$GITHUB_REF_NAME"
          assets=(
            build/Pixiv-SwiftUI.ipa
            build/Pixiv-SwiftUI-arm64.dmg
            build/Pixiv-SwiftUI-x86_64.dmg
          )

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            gh release create "$release_tag" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$release_tag" \
              --notes "pixiv-tags-data commit: $TAGS_DATA_COMMIT"
          fi
